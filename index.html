<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 19th Birthday Pakhi ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" loop preload="auto">
    <source src="hum.mp3" type="audio/mpeg">
</audio>

<div id="loginBox" class="card">

<h1>🔒 Pakhi Login 💖</h1>

<input
type="password"
id="password"
placeholder="Enter Secret Password">

<button onclick="checkPassword()">
Enter ❤️
</button>

<p id="wrong"></p>

</div>

<div id="mainBox" class="card">

<h1 class="title">
🎀 Happy 19th Birthday Pakhi 🎀
</h1>

<div id="messageBox">

<p id="message"></p>

</div>

<button id="nextBtn"
onclick="nextMessage()">
Next 💖
</button>

</div>

<script src="script.js"></script>

</body>
</html>
