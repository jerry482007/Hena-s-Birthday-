<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 19th Birthday Pakhi ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" preload="auto" loop>
    <source src="https://res.cloudinary.com/pkodbzjl/video/upload/f_mp3/v1785058077/Screenrecording_20260726_151923_q06dda.mp4" type="audio/mpeg">
</audio>

<!-- Login Box -->
<div id="loginBox" class="card">

<h1>🔒 Pakhi Login 💖</h1>

<input
type="password"
id="password"
placeholder="Enter Secret Password">

<button onclick="checkPassword()">
Enter ❤️
</button>

<p id="wrong"></p>

</div>

<!-- Welcome Box -->
<div id="welcomeBox" class="card" style="display:none;">

<h1 class="title">
💖 Welcome Pakhi 💖
</h1>

<p class="welcomeText">
Asho notun kichu adventure kora jak... ❤️
</p>

<button onclick="startMessages()">
Start ▶
</button>

</div>

<!-- Message Box -->
<div id="mainBox" class="card" style="display:none;">

<h1 class="title">
🎀 Happy 19th Birthday Pakhi 🎀
</h1>

<h3 id="alertTitle">
Message Alert #01
</h3>

<div id="messageBox">
<p id="message"></p>
</div>

<button id="nextBtn" onclick="nextMessage()">
Next 💖
</button>

</div>

<!-- Black Screen -->
<div id="blackScreen" style="display:none;">
  <div id="countdown">3</div>
</div>

<!-- Video Section -->
<div id="videoSection" class="card" style="display:none;">

<h2>🎁 A Special Surprise For You 🎁</h2>

<iframe
id="birthdayVideo"
src="https://drive.google.com/file/d/1EUEfC04Rnyt_K4bDyEqCvAA2vTE4G2NL/preview"
width="100%"
height="450"
allow="autoplay; fullscreen"
allowfullscreen
style="border:none;border-radius:15px;">
</iframe>

</div>

<script src="script.js"></script>

</body>
</html>
