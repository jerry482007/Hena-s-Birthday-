<!DOCTYPE html>
<html>
<head>
<title>For My Lokkhi Pakhi ❤️</title>

<style>
body{
background:linear-gradient(#ffc1dc,#fff);
font-family:Arial;
text-align:center;
padding:30px;
}

.box{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 20px pink;
}

button{
background:#ff4f91;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
font-size:18px;
}

input{
padding:12px;
border-radius:15px;
border:2px solid pink;
}

#main{
display:none;
}
</style>

</head>

<body>

<div class="box" id="login">

<h2>🌷 Enter Password 🌷</h2>

<input id="password" type="password">

<br><br>

<button onclick="check()">Enter ❤️</button>

<p id="wrong"></p>

</div>


<div class="box" id="main">

<h1>Welcome My Lokkhi Pakhi 🥹❤️</h1>

<p id="message"></p>

<button onclick="nextMsg()">Next 🌷</button>

<br><br>

<button onclick="playMusic()">🎵 Play Song</button>

<audio id="music">
<source src="hum.mp3" type="audio/mpeg">
</audio>

</div>


<script>

let messages=[

"🌷 Message Alert 1\nTumi amar jiboner onek special ekjon manush ❤️",

"🌹 Message Alert 2\nTomar hasi amar shobcheye pochonder jinis 🥹",

"🌷 Message Alert 3\nTomar sathe katano protita moment amar kache special 💗",

"🌹 Message Alert 4\nTumi amar Lokkhi Pakhi ❤️",

"🌷 Message Alert 5\nTomar jonno amar onek bhalobasha roilo 🫶",

"🌹 Message Alert 6\nAmi chai tomar protita din sundor hok ✨"

];

let count=0;


function check(){

let pass=document.getElementById("password").value;

if(pass=="onlyus28"){

document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";

document.getElementById("message").innerHTML=messages[0];
count=1;

}

else{

document.getElementById("wrong").innerHTML=
"Umm Amar lokkhi pakhi ta bhul korche 🥹, Abar try koro jaan 💋";

}

}


function nextMsg(){

if(count < messages.length){

document.getElementById("message").innerHTML=messages[count];
count++;

}

}


function playMusic(){

document.getElementById("music").play();

}

</script>

</body>
</html>
